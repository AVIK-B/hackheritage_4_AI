services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    environment:
      ORCH_ENV: dev
      ORCH_API_KEYS: '{"victim":"vk_dev","counsellor":"ck_dev","ops":"ok_dev"}'
      ORCH_LLM_BASE_URL: http://ollama:11434/v1
      ORCH_LLM_API_KEY: EMPTY
      ORCH_LLM_MODEL_MAP: '{"dialogue":"sahayak","summary":"casewriter"}'
      ORCH_SERVICES: '{"scoring":"http://host.docker.internal:8100","fusion":"http://host.docker.internal:8200","forecast":"http://host.docker.internal:8300","backend":"http://host.docker.internal:8400"}'
      ORCH_AUDIT_PATH: /data/audit/ledger.jsonl
      ORCH_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8500"]'
    volumes:
      - audit-data:/data/audit
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models:ro
    restart: unless-stopped

volumes:
  audit-data:
  ollama-data:
