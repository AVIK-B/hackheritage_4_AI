[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PERF", "RUF", "ISC"]
ignore = ["BLE001"]  # intentional: fail-safe degradation paths catch broad, log, and degrade — never silent

[tool.pytest.ini_options]
testpaths = ["tests"]