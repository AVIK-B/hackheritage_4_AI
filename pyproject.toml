[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "1.1.0"
description = "PS-26094 orchestration API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "PERF", "RUF", "ISC"]
ignore = ["BLE001", "ISC001"]  # BLE001: fail-safe degradation; ISC001: formatter conflict

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/data/**" = ["S311", "E501"]
"src/deployment/**" = ["S603"]
"src/orchestration/agents.py" = ["S101", "S311"]
"kaggle/**" = ["S603"]